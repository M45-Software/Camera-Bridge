name: Debian release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        uses: ./.github/actions/setup-build-deps
        with:
          packages-file: .github/ci/apt-packages.txt
      - name: Validate
        run: |
          bash -n canon-webcam.sh packaging/build-deb.sh tools/preview.sh
          shellcheck canon-webcam.sh packaging/build-deb.sh tools/preview.sh
          python3 -m unittest discover -s tests -v
          QT_QPA_PLATFORM=offscreen python3 tests/gui_smoke.py
      - name: Build Debian package
        run: |
          version=0.3.1
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; fi
          bash packaging/build-deb.sh "$version"
          cd dist
          sha256sum -- *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: camera-bridge-debian
          path: dist/*
      - name: Publish tagged release
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          printf 'release_tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  apt:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-apt.yml
    with:
      release_tag: ${{ needs.build.outputs.release_tag }}
    secrets:
      M45_APT_DEPLOY_KEY: ${{ secrets.M45_APT_DEPLOY_KEY }}
